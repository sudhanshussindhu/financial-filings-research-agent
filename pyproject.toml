[project]
name = "filings-agent"
version = "0.1.0"
description = "RAG Agengt"
readme = "README.md"
authors = [
    { name = "sudhanshussindhu", email = "sudhanshu.s.sindhu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
filings-agent = "filings_agent:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
